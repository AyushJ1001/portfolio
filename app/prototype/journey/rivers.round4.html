/* ── theme tokens: light is the default; dark via media/attr. Confluence inverts:
      dark = light gathering in a warm dark room · light = ink pooling on warm paper ── */
:root{
  --bg:#efe7d8; --bg2:#e4dac7; --ink:#2b2119; --text2:#5c4f42; --muted:#726556;
  --accent:#7f5510;
  --eng:#8c5220; --free:#276a5e; --music:#97466e; --more:#6a5c4e;
  --border:rgba(43,33,25,.14);
  --blend:multiply; --grain-op:.05;
  --floor:radial-gradient(120% 80% at 50% 120%, rgba(150,105,55,.20), transparent 60%);
  --bloom1:rgba(120,80,35,.20); --bloom2:rgba(150,105,55,.13); --bloom3:rgba(120,85,45,.08);
  --disc-bd:rgba(120,80,35,.40); --disc-gl:rgba(120,80,35,.14); --disc-in:rgba(120,80,35,.05);
  --stream-core:#40301a; --bed:rgba(70,52,32,.18);
  --name-core:#3a2c1c;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0f0a06; --bg2:#1c1611; --ink:#f2eee7; --text2:#c8bdb2; --muted:#a29081;
  --accent:#efc98b;
  --eng:#d0955f; --free:#67b0a0; --music:#ca87a4; --more:#87796e;
  --border:rgba(242,238,231,.08);
  --blend:screen; --grain-op:.03;
  --floor:radial-gradient(120% 80% at 50% 120%, rgba(70,42,20,.5), transparent 60%);
  --bloom1:rgba(255,244,224,.55); --bloom2:rgba(239,201,139,.22); --bloom3:rgba(180,120,60,.12);
  --disc-bd:rgba(239,201,139,.34); --disc-gl:rgba(239,201,139,.16); --disc-in:rgba(255,240,214,.06);
  --stream-core:#fff4e0; --bed:rgba(255,240,220,.12);
  --name-core:#fbe6c8;
}}
:root[data-theme="light"]{
  --bg:#efe7d8; --bg2:#e4dac7; --ink:#2b2119; --text2:#5c4f42; --muted:#726556;
  --accent:#7f5510; --eng:#8c5220; --free:#276a5e; --music:#97466e; --more:#6a5c4e;
  --border:rgba(43,33,25,.14); --blend:multiply; --grain-op:.05;
  --floor:radial-gradient(120% 80% at 50% 120%, rgba(150,105,55,.20), transparent 60%);
  --bloom1:rgba(120,80,35,.20); --bloom2:rgba(150,105,55,.13); --bloom3:rgba(120,85,45,.08);
  --disc-bd:rgba(120,80,35,.40); --disc-gl:rgba(120,80,35,.14); --disc-in:rgba(120,80,35,.05);
  --stream-core:#40301a; --bed:rgba(70,52,32,.18); --name-core:#3a2c1c;
}
:root[data-theme="dark"]{
  --bg:#0f0a06; --bg2:#1c1611; --ink:#f2eee7; --text2:#c8bdb2; --muted:#a29081;
  --accent:#efc98b; --eng:#d0955f; --free:#67b0a0; --music:#ca87a4; --more:#87796e;
  --border:rgba(242,238,231,.08); --blend:screen; --grain-op:.03;
  --floor:radial-gradient(120% 80% at 50% 120%, rgba(70,42,20,.5), transparent 60%);
  --bloom1:rgba(255,244,224,.55); --bloom2:rgba(239,201,139,.22); --bloom3:rgba(180,120,60,.12);
  --disc-bd:rgba(239,201,139,.34); --disc-gl:rgba(239,201,139,.16); --disc-in:rgba(255,240,214,.06);
  --stream-core:#fff4e0; --bed:rgba(255,240,220,.12); --name-core:#fbe6c8;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;
  transition:background .5s ease, color .5s ease}
.display{font-family:"YoungSerif",Georgia,serif;font-weight:400}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

.grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:var(--grain-op);mix-blend-mode:var(--blend);
  -webkit-mask-image:radial-gradient(circle at 50% 46%, transparent 8%, #000 60%);mask-image:radial-gradient(circle at 50% 46%, transparent 8%, #000 60%);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* room + layered light (screen in dark = glow · multiply in light = warm ink pool) */
.room{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.room .floor{position:absolute;inset:0;background:var(--floor)}
.bloom{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;mix-blend-mode:var(--blend);
  transition:opacity .6s ease}
.bloom.b1{width:16vmin;height:16vmin;background:radial-gradient(circle,var(--bloom1),transparent 66%)}
.bloom.b2{width:38vmin;height:38vmin;background:radial-gradient(circle,var(--bloom2),transparent 68%)}
.bloom.b3{width:80vmin;height:80vmin;background:radial-gradient(circle,var(--bloom3),transparent 70%)}
.tint{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:120vmax;height:120vmax;border-radius:50%;
  mix-blend-mode:var(--blend);opacity:0;pointer-events:none;transition:opacity .5s ease, background .5s ease}

.streams{position:fixed;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
.bed{fill:none;stroke:var(--bed);stroke-width:.32;stroke-linecap:round}
.stream{fill:none;stroke-width:.5;stroke-linecap:round;stroke-dasharray:1.2 3.1;mix-blend-mode:var(--blend);
  animation:flow 4s linear infinite;transition:stroke-width .4s ease, opacity .4s ease;opacity:.85}
.stream.lit{stroke-width:1.05;opacity:1;animation-duration:1s}
@keyframes flow{to{stroke-dashoffset:-8.6}}

/* origin: the plate is fixed; the head pivots at the neck and the eyes lead toward the cursor */
.origin{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:6;text-align:center;pointer-events:none}
.disc{position:relative;width:132px;height:132px;margin:0 auto;border-radius:50%;
  transition:border-color .5s ease, box-shadow .5s ease;
  border:1px solid var(--disc-bd);box-shadow:0 0 62px var(--disc-gl), inset 0 0 24px var(--disc-in);
  background:radial-gradient(circle at 50% 40%, var(--disc-in), transparent 72%)}
.disc .portrait{position:absolute;inset:3px;border-radius:50%;overflow:hidden}
.disc .head,.disc .eyes{position:absolute;inset:0;will-change:transform;transform-origin:50% 92%}
.disc .head{transition:transform .2s ease-out}
.disc .eyes{transition:transform .16s ease-out;
  -webkit-mask-image:radial-gradient(58% 19% at 50% 44%, #000 52%, transparent 100%);
  mask-image:radial-gradient(58% 19% at 50% 44%, #000 52%, transparent 100%)}
.disc .pimg{width:118%;height:118%;object-fit:cover;object-position:50% 16%;
  transform:translate(-50%,-50%);position:absolute;left:50%;top:50%;
  -webkit-mask-image:radial-gradient(circle at 50% 42%, #000 62%, transparent 82%);
  mask-image:radial-gradient(circle at 50% 42%, #000 62%, transparent 82%)}
.disc .halo{position:absolute;inset:-2px;border-radius:50%;pointer-events:none;
  box-shadow:inset 0 0 30px 4px var(--bg)}
.origin .sub{margin-top:22px;font-size:12px;letter-spacing:.02em;color:var(--muted);transition:color .5s ease}

main{position:absolute;inset:0}
.node{position:fixed;z-index:5;width:76px;height:76px;transform:translate(-50%,-50%);
  display:block;padding:0;background:none;transition:opacity .45s ease}
.node.dim{opacity:.32}
.node .ringwrap{position:relative;width:76px;height:76px;display:grid;place-items:center}
.node .ring{position:absolute;inset:0}
.node .prog{stroke:var(--hue)}
.node .core{width:14px;height:14px;border-radius:50%;background:var(--hue);transition:transform .35s ease}
.node:hover .core,.node:focus-visible .core{transform:scale(1.14)}
.node .lbl{position:absolute;top:calc(100% + 9px);left:50%;transform:translateX(-50%);width:14rem;text-align:center;pointer-events:none}
.node .name{display:block;font-size:16px;line-height:1.1;color:var(--hue)}
.node .tg{display:block;margin-top:5px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.node .ws{position:absolute;top:100%;left:50%;transform:translate(-50%,-4px);margin-top:8px;width:14rem;
  font-size:11.5px;line-height:1.4;color:var(--text2);opacity:0;transition:opacity .35s ease, transform .35s ease}
.node:hover .ws,.node:focus-visible .ws{opacity:1;transform:translate(-50%,0)}
.node.locked{cursor:not-allowed}
.node:focus-visible{outline:none}
.node:focus-visible .ringwrap::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1.5px solid var(--accent);opacity:.85}

.arrival{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:0 24px;opacity:0;pointer-events:none;transition:opacity .6s ease}
.arrival.show{opacity:1;pointer-events:auto}
.arrival .pre{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.arrival h2{margin:12px 0 0;font-size:clamp(2.6rem,7vw,3.6rem)}
.arrival .txt{margin:18px auto 0;max-width:26rem;color:var(--text2);line-height:1.65}
.arrival .back{margin-top:34px;font-size:14px;color:var(--muted);padding:9px 16px;border:1px solid var(--border);border-radius:999px;transition:color .3s, border-color .3s}
.arrival .back:hover,.arrival .back:focus-visible{color:var(--ink);border-color:var(--disc-bd);outline:none}
.arrival .inner{opacity:0;transform:translateY(10px)}
.arrival.show .inner{opacity:1;transform:none;transition:opacity .5s .15s ease, transform .5s .15s ease}

.intro{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:40;max-width:calc(100vw - 96px);
  font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:center;line-height:1.5;padding:0 8px}
.intro b{color:var(--accent);font-weight:500}
.foot{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;text-align:center}
.foot .tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.themebtn{position:fixed;top:14px;right:14px;z-index:60;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;background:var(--bg2);
  transition:color .3s, border-color .3s}
.themebtn:hover,.themebtn:focus-visible{color:var(--ink);border-color:var(--disc-bd);outline:none}
.themebtn svg{width:17px;height:17px}

@media (max-width:560px){ .node{width:64px;height:64px} .node .ringwrap{width:64px;height:64px} .intro{font-size:10px} }
@media (prefers-reduced-motion: reduce){
  .stream{animation:none!important}
  .bloom,.tint,.stream,.node,.node .ws,.node .core,.disc,.arrival,.arrival .inner,.origin .sub{transition:opacity .2s ease!important}
  .disc{transition:opacity .2s ease!important}
}
</style>

function makeHold(render,onDone,locked,dur){
  var raf=null,st=null;dur=dur||HOLD;
  function frame(t){if(st===null)st=t;var p=Math.min((t-st)/dur,1);render(p);if(p>=1){clear();onDone();return}raf=requestAnimationFrame(frame)}
  function clear(){if(raf)cancelAnimationFrame(raf);raf=null;st=null}
  return {begin:function(d){if(locked){render(0);return}clear();dur=d||HOLD;raf=requestAnimationFrame(frame)},reset:function(){clear();render(0)}};
}
function lightRoom(w){
  var hue=cssv(w.v);
  tint.style.background="radial-gradient(circle,"+hexA(hue,.55)+",transparent 58%)";tint.style.opacity=".2";
  disc.style.borderColor=hexA(hue,.55);disc.style.boxShadow="0 0 74px "+hexA(hue,.30)+", inset 0 0 24px var(--disc-in)";
  sub.textContent=w.locked?"this current isn't flowing yet":"hold to follow "+w.name.replace("…and ","")+" in";
  w._stream.classList.add("lit");
}
function darkRoom(){
  tint.style.opacity="0";disc.style.borderColor="var(--disc-bd)";
  disc.style.boxShadow="0 0 62px var(--disc-gl), inset 0 0 24px var(--disc-in)";
  sub.textContent="four currents run from one source";
  WORLDS.forEach(function(w){w._stream&&w._stream.classList.remove("lit")});
}
function focusOthers(cur){WORLDS.forEach(function(w){w._node&&w._node.classList.toggle("dim",cur&&w!==cur)})}
function enter(w){
  document.getElementById("arr-name").textContent=w.name;document.getElementById("arr-name").style.color=cssv(w.v);
  document.getElementById("arr-txt").textContent=w.arr;
  arrivalEl.style.background="radial-gradient(circle at 50% 42%, "+hexA(cssv(w.v),.18)+", var(--bg) 66%)";
  arrivalEl.classList.add("show");
}
document.getElementById("arr-back").addEventListener("click",function(){arrivalEl.classList.remove("show");darkRoom();focusOthers(null)});

safe("nodes",function(){
  WORLDS.forEach(function(w){
    var s=w.slot,R=32,LEN=2*Math.PI*R;
    var dx=(CX-s.x),dy=(CY-s.y),m=Math.hypot(dx,dy);dx/=m;dy/=m;
    var btn=document.createElement("button");
    btn.className="node"+(w.locked?" locked":"");btn.style.left=s.x+"%";btn.style.top=s.y+"%";
    btn.style.setProperty("--hue","var("+w.v+")");btn.setAttribute("type","button");
    btn.setAttribute("aria-label",w.name+(w.locked?" — not open yet":" — hold, or press Enter, to enter"));
    if(w.locked)btn.setAttribute("aria-disabled","true");
    btn.innerHTML=
      '<span class="ringwrap"><svg class="ring" viewBox="0 0 76 76">'
      +'<circle cx="38" cy="38" r="'+R+'" fill="none" stroke="var(--border)" stroke-width="2"/>'
      +'<circle class="prog" cx="38" cy="38" r="'+R+'" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="'+LEN+'" stroke-dashoffset="'+LEN+'" opacity="'+(w.locked?.2:.95)+'" transform="rotate(-90 38 38)"/></svg>'
      +'<span class="core" style="box-shadow:'+(dx*7).toFixed(1)+'px '+(dy*7).toFixed(1)+'px 20px var('+w.v+'), 0 0 9px var('+w.v+')"></span></span>'
      +'<span class="lbl"><span class="name display">'+w.name+'</span>'
      +'<span class="tg">'+w.tag+'</span><span class="ws">'+w.ws+'</span></span>';
    nodesEl.appendChild(btn);w._node=btn;
    var prog=btn.querySelector(".prog");
    function set(p){prog.setAttribute("stroke-dashoffset",LEN*(1-p))}
    var hold=makeHold(set,function(){enter(w)},w.locked);
    function on(){lightRoom(w);focusOthers(w)}
    btn.addEventListener("pointerdown",function(e){e.preventDefault();btn.focus();on();hold.begin(HOLD)});
    btn.addEventListener("pointerup",function(){hold.reset()});
    btn.addEventListener("pointerenter",on);
    btn.addEventListener("pointerleave",function(){hold.reset();if(document.activeElement!==btn){darkRoom();focusOthers(null)}});
    btn.addEventListener("focus",on);
    btn.addEventListener("blur",function(){hold.reset();darkRoom();focusOthers(null)});
    var kd=false;
    btn.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&!kd){e.preventDefault();if(w.locked)return;kd=true;on();hold.begin(reduced()?60:KEYHOLD)}});
    btn.addEventListener("keyup",function(e){if(e.key==="Enter"||e.key===" "){kd=false;hold.reset()}});
  });
});

/* the plate stays put; the head pivots at the neck and the eyes lead toward the cursor */
safe("tilt",function(){
  if(reduced())return;
  var head=document.getElementById("head"), eyes=document.getElementById("eyes");
  var TX=9, TY=5, ROT=8, EYE=1.42;          // head translate/rotate (pivots at the neck) + gentle eye lead
  var hx=0,hy=0,hr=0, tx=0,ty=0,tr=0, raf=null;
  function loop(){
    hx+=(tx-hx)*.13; hy+=(ty-hy)*.13; hr+=(tr-hr)*.13;
    head.style.transform="translate("+hx.toFixed(2)+"px,"+hy.toFixed(2)+"px) rotate("+hr.toFixed(2)+"deg)";
    eyes.style.transform="translate("+(hx*EYE).toFixed(2)+"px,"+(hy*EYE).toFixed(2)+"px) rotate("+hr.toFixed(2)+"deg)";
    if(Math.abs(tx-hx)>.03||Math.abs(ty-hy)>.03||Math.abs(tr-hr)>.03){raf=requestAnimationFrame(loop)}else{raf=null}
  }
  window.addEventListener("pointermove",function(e){
    var nx=(e.clientX/window.innerWidth)*2-1, ny=(e.clientY/window.innerHeight)*2-1;
    tx=nx*TX; ty=ny*TY; tr=nx*ROT; if(!raf)raf=requestAnimationFrame(loop);
  },{passive:true});
});

/* theme toggle (respects OS default; button overrides via data-theme) */
safe("theme",function(){
  var btn=document.getElementById("themebtn");
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>';
  function current(){var a=document.documentElement.getAttribute("data-theme");
    if(a)return a;return matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}
  function paint(){var d=current()==="dark";btn.innerHTML=d?SUN:MOON;btn.setAttribute("aria-label",d?"Switch to light":"Switch to dark");}
  btn.addEventListener("click",function(){document.documentElement.setAttribute("data-theme",current()==="dark"?"light":"dark");paint();});
  paint();
});
</script>
