:root{
  /* warm near-black "room", worlds as one OKLCH family, accent = origin candle-light */
  --bg:#0f0a06; --bg2:#1c1611;
  --ink:#f2eee7; --text2:#c8bdb2; --muted:#a29081;
  --accent:#efc98b;               /* candle/origin light — its own role, no world uses it */
  --eng:#d0955f; --free:#67b0a0; --music:#ca87a4; --more:#87796e;
  --border:rgba(242,238,231,.08);
  --z-field:1; --z-streams:2; --z-nodes:5; --z-origin:6; --z-chrome:40; --z-arrival:50;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.display{font-family:"YoungSerif",Georgia,serif;font-weight:400}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* film grain, modulated by a soft mask so it lives in shadow, not on a flat plane */
.grain{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:.03;mix-blend-mode:overlay;
  -webkit-mask-image:radial-gradient(circle at 50% 46%, transparent 8%, #000 60%);
  mask-image:radial-gradient(circle at 50% 46%, transparent 8%, #000 60%);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ── the room: layered light, not one flat haze ── */
.room{position:fixed;inset:0;z-index:var(--z-field);pointer-events:none;overflow:hidden}
.room .floor{position:absolute;inset:0;
  background:radial-gradient(120% 80% at 50% 120%, rgba(70,42,20,.5), transparent 60%)}
/* the confluence bloom — three stacked lights, screen-blended so overlap brightens */
.bloom{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;
  mix-blend-mode:screen;pointer-events:none;transition:background .6s ease, opacity .6s ease}
.bloom.b1{width:16vmin;height:16vmin;background:radial-gradient(circle,rgba(255,244,224,.55),transparent 65%)}
.bloom.b2{width:38vmin;height:38vmin;background:radial-gradient(circle,rgba(239,201,139,.22),transparent 68%)}
.bloom.b3{width:78vmin;height:78vmin;background:radial-gradient(circle,rgba(180,120,60,.12),transparent 70%)}
/* focused world floods the room with its own light */
.tint{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:100vmax;height:100vmax;
  border-radius:50%;mix-blend-mode:screen;opacity:0;pointer-events:none;transition:opacity .5s ease, background .5s ease}

/* ── streams ── */
.streams{position:fixed;inset:0;z-index:var(--z-streams);width:100%;height:100%;pointer-events:none}
.stream{fill:none;stroke-width:.5;stroke-linecap:round;stroke-dasharray:1.3 3.6;
  animation:flow 4s linear infinite;transition:stroke-width .4s ease, opacity .4s ease;opacity:.7}
.stream.lit{stroke-width:1.05;opacity:1;animation-duration:1s}
@keyframes flow{to{stroke-dashoffset:-9.8}}

/* ── origin ── */
.origin{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:var(--z-origin);text-align:center;pointer-events:none}
.origin .disc{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
  border:1px solid rgba(239,201,139,.34);background:radial-gradient(circle at 50% 38%, rgba(255,246,228,.10), transparent 70%);
  transition:border-color .5s ease, box-shadow .5s ease;box-shadow:0 0 60px rgba(239,201,139,.16), inset 0 0 22px rgba(255,240,214,.06)}
.origin .disc .name{font-size:22px;letter-spacing:.01em;color:#fbe6c8}
.origin .sub{margin-top:20px;font-size:12px;letter-spacing:.02em;color:var(--muted)}

/* ── a current (button) ── */
.node{position:fixed;z-index:var(--z-nodes);width:132px;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:0;padding:0;background:none;
  transition:opacity .45s ease}
.node.dim{opacity:.34}
.ringwrap{position:relative;width:76px;height:76px;display:grid;place-items:center}
.node .ring{position:absolute;inset:0}
.node .core{width:14px;height:14px;border-radius:50%;transition:box-shadow .4s ease, transform .35s ease}
.node:hover .core,.node:focus-visible .core{transform:scale(1.12)}
.node .name{margin-top:12px;font-size:16px;line-height:1.1;transition:opacity .35s ease}
.node .ws{margin-top:4px;font-size:11.5px;line-height:1.4;color:var(--text2);max-width:14rem;
  opacity:0;transform:translateY(-3px);transition:opacity .35s ease, transform .35s ease}
.node .tg{margin-top:6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.node:hover .ws,.node:focus-visible .ws{opacity:1;transform:none}
.node.locked{cursor:not-allowed}
.node:focus-visible{outline:none}
.node:focus-visible .ringwrap::after{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid var(--accent);opacity:.8}

/* ── arrival ── */
.arrival{position:fixed;inset:0;z-index:var(--z-arrival);display:flex;align-items:center;justify-content:center;
  text-align:center;padding:0 24px;opacity:0;pointer-events:none;transition:opacity .6s ease}
.arrival.show{opacity:1;pointer-events:auto}
.arrival .pre{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.arrival h2{margin:12px 0 0;font-size:clamp(2.6rem,7vw,3.6rem)}
.arrival .txt{margin:18px auto 0;max-width:26rem;color:var(--text2);line-height:1.65}
.arrival .back{margin-top:36px;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border:1px solid var(--border);border-radius:999px;transition:color .3s, border-color .3s}
.arrival .back:hover,.arrival .back:focus-visible{color:var(--ink);border-color:rgba(242,238,231,.28);outline:none}
.arrival .inner{opacity:0;transform:translateY(10px)}
.arrival.show .inner{opacity:1;transform:none;transition:opacity .5s .15s ease, transform .5s .15s ease}

/* ── chrome ── */
.intro{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:var(--z-chrome);
  max-width:calc(100vw - 32px);font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:center;
  line-height:1.5;padding:0 8px}
.intro b{color:var(--accent);font-weight:500}
.foot{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:var(--z-chrome);text-align:center}
.foot .tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

@media (max-width:560px){
  .node{width:112px}
  .intro{font-size:10px}
}

@media (prefers-reduced-motion: reduce){
  .stream{animation:none!important}
  .bloom,.tint,.stream,.node,.node .ws,.node .core,.origin .disc,.arrival,.arrival .inner{transition:opacity .2s ease!important}
}

  streams.appendChild(defs);
  WORLDS.forEach(function(w,i){
    var s=w.slot;
    var grad=document.createElementNS(svgNS,"linearGradient");
    grad.setAttribute("id","g"+i);grad.setAttribute("gradientUnits","userSpaceOnUse");
    grad.setAttribute("x1",s.x);grad.setAttribute("y1",s.y);grad.setAttribute("x2",CX);grad.setAttribute("y2",CY);
    var st0=document.createElementNS(svgNS,"stop");st0.setAttribute("offset","0%");st0.setAttribute("stop-color",hexA(w.hue,.35));
    var st1=document.createElementNS(svgNS,"stop");st1.setAttribute("offset","100%");st1.setAttribute("stop-color","rgba(255,244,224,.9)");
    grad.appendChild(st0);grad.appendChild(st1);defs.appendChild(grad);
    var ln=document.createElementNS(svgNS,"line");
    ln.setAttribute("x1",s.x);ln.setAttribute("y1",s.y);ln.setAttribute("x2",CX);ln.setAttribute("y2",CY);
    ln.setAttribute("stroke",w.locked?"rgba(135,121,110,.4)":"url(#g"+i+")");
    ln.setAttribute("class","stream");ln.style.animationDelay=(-i*0.5)+"s";
    w._stream=ln;streams.appendChild(ln);
  });
});

/* hold controller (the ring-fill) */
function makeHold(render,onDone,locked,dur){
  var raf=null,st=null;dur=dur||HOLD;
  function frame(t){if(st===null)st=t;var p=Math.min((t-st)/dur,1);render(p);
    if(p>=1){clear();onDone();return}raf=requestAnimationFrame(frame)}
  function clear(){if(raf)cancelAnimationFrame(raf);raf=null;st=null}
  return {begin:function(d){if(locked){render(0);return}clear();dur=d||HOLD;raf=requestAnimationFrame(frame)},
          reset:function(){clear();render(0)}};
}

function lightRoom(w){
  // the touched current lights the whole room + tints the origin
  tint.style.background="radial-gradient(circle,"+hexA(w.hue,.5)+",transparent 60%)";
  tint.style.opacity=".16";
  disc.style.borderColor=hexA(w.hue,.5);
  disc.style.boxShadow="0 0 70px "+hexA(w.hue,.28)+", inset 0 0 22px rgba(255,240,214,.06)";
  sub.textContent=w.locked?"this current isn't flowing yet":"hold to follow "+w.name.replace("…and ","")+" in";
  w._stream.classList.add("lit");
}
function darkRoom(){
  tint.style.opacity="0";
  disc.style.borderColor="rgba(239,201,139,.34)";
  disc.style.boxShadow="0 0 60px rgba(239,201,139,.16), inset 0 0 22px rgba(255,240,214,.06)";
  sub.textContent="four currents run from one source";
  WORLDS.forEach(function(w){w._stream&&w._stream.classList.remove("lit")});
}
function focusOthers(cur){WORLDS.forEach(function(w){w._node&&w._node.classList.toggle("dim",cur&&w!==cur)})}

function enter(w){
  document.getElementById("arr-name").textContent=w.name;
  document.getElementById("arr-name").style.color=w.hue;
  document.getElementById("arr-txt").textContent=w.arr;
  arrivalEl.style.background="radial-gradient(circle at 50% 42%, "+hexA(w.hue,.16)+", var(--bg) 66%)";
  arrivalEl.classList.add("show");
}
document.getElementById("arr-back").addEventListener("click",function(){arrivalEl.classList.remove("show");darkRoom();focusOthers(null)});

safe("nodes",function(){
  WORLDS.forEach(function(w){
    var s=w.slot;
    var R=32,LEN=2*Math.PI*R;
    // directional glow: brighter on the side facing the origin
    var dx=(CX-s.x), dy=(CY-s.y), m=Math.hypot(dx,dy); dx/=m; dy/=m;
    var btn=document.createElement("button");
    btn.className="node"+(w.locked?" locked":"");
    btn.style.left=s.x+"%";btn.style.top=s.y+"%";
    btn.setAttribute("type","button");
    btn.setAttribute("aria-label",w.name+(w.locked?" — not open yet":" — hold or press Enter to enter"));
    if(w.locked)btn.setAttribute("aria-disabled","true");
    btn.innerHTML=
      '<span class="ringwrap"><svg class="ring" viewBox="0 0 76 76">'
      +'<circle cx="38" cy="38" r="'+R+'" fill="none" stroke="rgba(242,238,231,.10)" stroke-width="2"/>'
      +'<circle class="prog" cx="38" cy="38" r="'+R+'" fill="none" stroke="'+w.hue+'" stroke-width="2.5" stroke-linecap="round" '
      +'stroke-dasharray="'+LEN+'" stroke-dashoffset="'+LEN+'" opacity="'+(w.locked?.18:.95)+'" transform="rotate(-90 38 38)"/></svg>'
      +'<span class="core" style="background:'+w.hue+';box-shadow:'+(dx*7).toFixed(1)+'px '+(dy*7).toFixed(1)+'px 20px '+w.hue+', 0 0 8px '+hexA(w.hue,.6)+'"></span></span>'
      +'<span class="name display" style="color:'+w.hue+'">'+w.name+'</span>'
      +'<span class="ws">'+w.ws+'</span>'
      +'<span class="tg">'+w.tag+'</span>';
    nodesEl.appendChild(btn);
    w._node=btn;
    var prog=btn.querySelector(".prog");
    function set(p){prog.setAttribute("stroke-dashoffset",LEN*(1-p))}
    var hold=makeHold(set,function(){enter(w)},w.locked);
    function on(){lightRoom(w);focusOthers(w)}
    function off(){hold.reset();if(document.activeElement!==btn){darkRoom();focusOthers(null)}}
    btn.addEventListener("pointerdown",function(e){e.preventDefault();btn.focus();on();hold.begin(HOLD)});
    btn.addEventListener("pointerup",function(){hold.reset()});
    btn.addEventListener("pointerenter",on);
    btn.addEventListener("pointerleave",off);
    btn.addEventListener("focus",on);
    btn.addEventListener("blur",function(){hold.reset();darkRoom();focusOthers(null)});
    // keyboard: Enter/Space runs a shorter fill then enters (accessible commit)
    var keyDown=false;
    btn.addEventListener("keydown",function(e){
      if((e.key==="Enter"||e.key===" ")&&!keyDown){e.preventDefault();if(w.locked)return;keyDown=true;on();hold.begin(reduced()?60:KEYHOLD)}
    });
    btn.addEventListener("keyup",function(e){if(e.key==="Enter"||e.key===" "){keyDown=false;hold.reset()}});
  });
});
</script>
